<style>
	#game-container {
		position: relative;
		width: 300px;
		height: 300px;
		border: 2px solid #333;
		margin-bottom: 20px;
		border-radius: 10px;
		background-color: black;
	}

	#target-box {
		position: absolute;
		width: 50px;
		height: 50px;
		background-color: red;
		cursor: pointer;
		border-radius: 10px;
	}

	#score-display {
		font-size: 18px;
		margin-bottom: 10px;
	}

	.game-btn {
		padding: 8px 18px;
		margin: 5px 8px 5px 0;
		font-size: 16px;
		border: none;
		border-radius: 6px;
		background-color: #533;
		color: #fff;
		cursor: pointer;
		transition: background 0.2s;
		box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
	}

	.game-btn:hover {
		background-color: gray;
	}

	.flex-main-container {
		display: flex;
		flex-direction: row;
		gap: 32px;
		justify-content: start;
		align-items: flex-start;
		margin-top: 20px;
	}

	@media (max-width: 700px) {
		.flex-main-container {
			flex-direction: column;
			align-items: stretch;
			gap: 16px;
		}
	}

	#game-ui {
		min-width: 340px;
	}

	.confetti-canvas {
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		pointer-events: none;
		z-index: 10;
	}

	.leaderboard-container {
		position: relative;
		min-width: 440px;
		max-width: max-content;
	}
</style>


<div class="flex-main-container">
	<div id="game-ui">
		<h3>Catch the box - Mini Game</h3>
		<div id="score-display">Your Current Score: <span id="game-score">0</span></div>
		<div id="game-container">
			<div id="target-box"></div>
		</div>
		<button id="reset-game" class="game-btn">Reset Game</button>
		<button id="submit-game" class="game-btn">Submit Score</button>

	</div>

	<div class="leaderboard-container">
		<canvas id="confetti-canvas" class="confetti-canvas"></canvas>
		<h3>Realtime Leaderboard</h3>

		<table class="table table-striped">
			<thead>
				<tr>
					<th>Rank</th>
					<th>Player Username</th>
					<th>Highest Score</th>
				</tr>
			</thead>
			<tbody id="leaderboard-body"></tbody>
		</table>
	</div>
</div>
